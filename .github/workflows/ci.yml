name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - name: Run required checks
        run: make check
      - name: Package preview
        run: python3 scripts/package-release.py --version "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Whispr Lite.app/Contents/Info.plist')" --channel preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisprLite-preview-${{ github.sha }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
