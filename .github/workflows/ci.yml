name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Confirm Apple Silicon and Swift
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Tests, app build and bundle smoke check
        run: make check
