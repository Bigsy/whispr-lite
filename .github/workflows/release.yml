name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0-beta.1'
        required: true
        default: 0.1.0-beta.1
      channel:
        description: 'Preview needs no Apple credentials; notarized requires release secrets'
        type: choice
        options: [preview, notarized]
        default: preview
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - name: Validate release version and channel
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/release-plan.py
      - name: Import distribution credentials
        if: env.RELEASE_CHANNEL == 'notarized'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/ci-signing.sh
      - name: Run required checks
        run: make check
      - name: Package and verify distribution
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 scripts/package-release.py --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisprLite-${{ env.RELEASE_VERSION }}-${{ env.RELEASE_CHANNEL }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub release for a version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$RELEASE_CHANNEL" == preview ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/releases/* \
            --verify-tag --draft "${flags[@]}" \
            --title "Whispr Lite $RELEASE_VERSION" \
            --notes-file Resources/RELEASE-INSTALL.md
      - name: Remove distribution credentials
        if: always()
        run: bash scripts/ci-signing.sh cleanup
